<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Concert Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">CONCERT<span>PORTAL</span></a>
      <div class="nav-actions">
        {% if request.session.get("user_id") %}
          <form class="logout-form" action="/logout" method="post">
            <button class="nav-link logout-button" type="submit">
              Logout
            </button>
          </form>
        {% else %}
          <a class="nav-link" href="/register/attendee">
            Attendee Registration
          </a>

    <a class="nav-link" href="/register/organiser">
      Organiser Registration
    </a>

    <a class="nav-link" href="/login">Login</a>
  {% endif %}

  <a class="btn-pill" href="/concerts/new">
    + Create Concert
  </a>
</div>
    </div>
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
